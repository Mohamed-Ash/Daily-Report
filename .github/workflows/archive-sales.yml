name: Archive Sales Tables

on:
  schedule:
    - cron: '30 8 * * *'   # 10:30 صباحاً توقيت القاهرة
    - cron: '0 14 * * *'   # 4:00 مساءً توقيت القاهرة
  workflow_dispatch:        # زرار تشغيل يدوي من GitHub

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Archive sales tables snapshot
        run: node archive-sales.js

      - name: Commit & push
        run: |
          git config user.name  "Sales Archive Bot"
          git config user.email "bot@ellwaa.com"
          git add history/sales-*.json
          git diff --staged --quiet || git commit -m "Archive sales tables $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
